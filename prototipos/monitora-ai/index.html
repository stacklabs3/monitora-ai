<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Monitora AI · protótipo do desenho inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>

<style>
:root {
  --font-display: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

  /* Marca do Monitora AI. O repositório não tinha paleta: estes valores nascem neste
     protótipo (Definir princípios de UI/UX, Limites) e se aprovam com ele. */
  --primary:        #0E3B43;
  --primary-deep:   #082429;
  --primary-soft:   #D5E7EA;
  --accent:         #0F766E;
  --accent-soft:    #DDF3F0;
  --on-accent:      #FFFFFF;

  /* Tema claro */
  --bg:             #F6F8F9;
  --fg:             #10201F;
  --surface:        #FFFFFF;
  --surface-2:      #EDF1F3;
  --input-bg:       #FFFFFF;
  --border:         rgba(16, 32, 31, 0.10);
  --border-strong:  rgba(16, 32, 31, 0.24);
  /* Contorno de campo de digitar e de escolher: 3:1 contra o fundo (WCAG 1.4.11) */
  --border-control: #74838A;
  --muted:          #51626A;
  --tabbar-bg:      rgba(246, 248, 249, 0.92);
  --header-blur-bg: rgba(255, 255, 255, 0.82);
  --veu:            rgba(8, 20, 22, 0.40);
  /* Realce de botão: uma camada por cima da cor dele, ao passar o mouse e ao apertar */
  --realce:         rgba(16, 32, 31, 0.07);
  --realce-forte:   rgba(16, 32, 31, 0.14);

  /* Situação */
  --ok:             #15803D;
  --ok-soft:        #DCFCE7;
  --ok-fg:          #166534;
  --warn:           #B45309;
  --warn-soft:      #FEF3C7;
  --danger:         #B42318;
  --danger-soft:    #FEE4E2;
  --on-danger:      #FFFFFF;

  /* Nível do evento: o texto sempre escrito, a cor como reforço */
  --nivel-erro-bg:  #FEE4E2;
  --nivel-erro-fg:  #9F1C12;
  --nivel-aviso-bg: #FEF0C7;
  --nivel-aviso-fg: #7A4300;
  --nivel-info-bg:  #E6EEF1;
  --nivel-info-fg:  #3D4F57;

  /* Moldura da conversa do canal de alerta */
  --chat-fundo:     #DCE7E4;
  --chat-balao:     #FFFFFF;
  --chat-botao:     #F0F6F5;
  --chat-data:      rgba(255, 255, 255, 0.72);

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.14);
  --shadow-device: 0 32px 64px rgba(15, 23, 42, 0.28);

  /* Toast */
  --toast-bg:       #0F172A;
  --toast-fg:       #F8FAFC;
}

[data-theme="dark"] {
  --primary:        #E3F1EF;
  --primary-deep:   #FFFFFF;
  --primary-soft:   #1E3236;
  --accent:         #5CCFC0;
  --accent-soft:    #123A37;
  --on-accent:      #062421;

  --bg:             #0A1213;
  --fg:             #E6EEEE;
  --surface:        #111C1E;
  --surface-2:      #182629;
  --input-bg:       #0E181A;
  --border:         rgba(230, 238, 238, 0.10);
  --border-strong:  rgba(230, 238, 238, 0.24);
  --border-control: #6E8188;
  --muted:          #9AABB0;
  --tabbar-bg:      rgba(10, 18, 19, 0.92);
  --header-blur-bg: rgba(17, 28, 30, 0.82);
  --veu:            rgba(0, 0, 0, 0.60);
  --realce:         rgba(230, 238, 238, 0.10);
  --realce-forte:   rgba(230, 238, 238, 0.18);

  --ok:             #4ADE80;
  --ok-soft:        #12371F;
  --ok-fg:          #86EFAC;
  --warn:           #FBBF24;
  --warn-soft:      #3A2A06;
  --danger:         #F87171;
  --danger-soft:    #3B1212;
  --on-danger:      #1A0505;

  --nivel-erro-bg:  #3B1212;
  --nivel-erro-fg:  #FCA5A5;
  --nivel-aviso-bg: #3A2A06;
  --nivel-aviso-fg: #FCD34D;
  --nivel-info-bg:  #1E2E32;
  --nivel-info-fg:  #B6C5CA;

  --chat-fundo:     #0E1A1C;
  --chat-balao:     #182629;
  --chat-botao:     #1E3236;
  --chat-data:      rgba(24, 38, 41, 0.85);

  --toast-bg:       #F1F5F9;
  --toast-fg:       #0F172A;

  --shadow-device: 0 32px 64px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100%;
  font-family: var(--font-display);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  overflow-x: hidden;
}

#root { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

input, textarea, button, select { font-family: inherit; }
/* O exemplo dentro do campo usa a cor de texto secundário: a do navegador reprova no escuro. */
::placeholder { color: var(--muted); opacity: 1; }
button { cursor: pointer; }

/* Foco sempre visível, nos dois temas (Definir princípios de UI/UX, Q3). */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.campo-sem-moldura:focus-visible { outline: none; }
label:focus-within:has(.campo-sem-moldura) { outline: 2px solid var(--accent); outline-offset: 1px; }
.caixa-de-campo:has(.campo-sem-moldura:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Linha da lista de eventos e item de lista que se escolhe: os estados que o estilo em
   linha não alcança. As variantes "--hover", "--focus" e "--active" são as que o grupo
   Estado do painel flutuante força, para a conferência. */
.linha-de-evento:hover, .linha-de-evento--hover, .item-realcavel:hover { background: var(--surface-2); }
.linha-de-evento:active, .linha-de-evento--active { background: var(--primary-soft); }
.linha-de-evento[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.linha-de-evento:focus-visible, .linha-de-evento--focus { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Linha que não abre agora (sem internet, desabilitada): não acende ao passar o mouse nem ao apertar. */
.linha-de-evento[aria-disabled="true"]:not([aria-current="true"]):hover,
.linha-de-evento[aria-disabled="true"]:not([aria-current="true"]):active { background: transparent; }

/* Botão: o realce é uma camada por cima da cor de cada variante, que vem em linha.
   As variantes "--hover", "--focus" e "--active" são as que o grupo Estado força. */
.botao:hover, .botao--hover { box-shadow: inset 0 0 0 999px var(--realce); }
.botao:active, .botao--active { box-shadow: inset 0 0 0 999px var(--realce-forte); }
.botao[aria-disabled="true"] { box-shadow: none; }
.botao--focus { outline: 2px solid var(--accent); outline-offset: 2px; }

/* O painel do evento aberto recebe o foco ao abrir: o contorno fica por dentro da borda. */
.painel-do-evento:focus-visible { outline-offset: -2px; }

/* Área com rolagem própria (lista ao lado do evento, evento aberto, pilha do erro): a
   barra aparece, para a pessoa ver que há mais. */
.rolagem-propria::-webkit-scrollbar { width: 8px; height: 8px; }
.rolagem-propria::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
.rolagem-propria::-webkit-scrollbar-corner { background: transparent; }

/* Texto só para leitor de tela. */
.so-leitor {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* Showcase chrome */
.showcase-shell {
  display: flex; flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* Header enxuto: marca, abas e modo. Todo controle mora no painel flutuante, e as
   abas rolam na horizontal: o header nunca disputa espaco com o numero de telas. */
.showcase-header {
  flex-shrink: 0;
  display: flex; align-items: center; gap: var(--space-5);
  padding: var(--space-3) var(--space-5);
  background: var(--header-blur-bg);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--border);
  z-index: 50;
}
.showcase-brand {
  display: flex; align-items: center; gap: var(--space-2);
  font-weight: 800; font-size: 18px; letter-spacing: -0.4px;
  color: var(--primary-deep);
  flex-shrink: 0;
}
[data-theme="dark"] .showcase-brand { color: var(--primary); }
.showcase-brand .accent { color: var(--accent); }

/* Abas: uma por visao (superficie ou papel), declaradas em visoes.jsx. */
.showcase-abas {
  flex: 1; min-width: 0;
  display: flex; gap: var(--space-1);
  overflow-x: auto;
}
.showcase-abas button {
  border: 0; background: transparent;
  padding: var(--space-2) var(--space-3);
  font-size: 13px; font-weight: 700;
  color: var(--muted);
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.showcase-abas button:hover { color: var(--fg); }
.showcase-abas button.active {
  color: var(--fg);
  background: var(--surface-2);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.showcase-abas button:focus-visible,
.showcase-modo button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.showcase-modo {
  margin-left: auto;
  display: flex; gap: 2px;
  padding: 3px;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  flex-shrink: 0;
}
.showcase-modo button {
  border: 0; background: transparent;
  padding: var(--space-2) var(--space-4);
  font-size: 13px; font-weight: 700;
  color: var(--muted);
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.showcase-modo button.active {
  background: var(--surface);
  color: var(--fg);
  box-shadow: var(--shadow-sm);
}

.showcase-body {
  flex: 1;
  display: flex;
  align-items: center; justify-content: center;
  padding: var(--space-5);
  min-height: 0;
  overflow: auto;
  background: var(--surface-2);
}

/* Alinhamento ao topo no modo grade. Com o `align-items: center` acima, uma grade mais alta
   que a viewport transborda para os dois lados e as primeiras telas ficam inalcancaveis: o
   scroll ja esta em zero e nao ha como subir. So aparece com muitas telas, entao some em
   prototipo pequeno e volta a morder no grande. */
.showcase-body--grade { align-items: flex-start; }

/* Modo print: so a tela na moldura, sem header nem painel. */
.showcase-body--print { height: 100vh; padding: 0; }

/* Modo Showcase: as rotinas da aba, cada uma com as telas em ordem */
.showcase-grade {
  display: flex; flex-direction: column; gap: var(--space-6);
  width: 100%; padding: var(--space-2);
}
.grade-rotina { display: flex; flex-direction: column; gap: var(--space-3); }
.grade-rotina-titulo { font-size: 14px; font-weight: 800; color: var(--fg); }
.grade-rotina-telas {
  display: flex; gap: var(--space-3);
  align-items: flex-start;
  overflow-x: auto; padding-bottom: var(--space-2);
}
.grade-tile {
  display: flex; flex-direction: column; gap: var(--space-2);
  flex-shrink: 0;
}
.grade-tile-label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--muted);
}
.grade-tile-viewport {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: auto;
}

/* ---------- Painel de controle flutuante ---------- */
.painel {
  position: fixed;
  right: var(--space-5);
  bottom: var(--space-5);
  z-index: 100;
  display: flex; flex-direction: column;
  align-items: flex-end; gap: var(--space-2);
}

.painel-toggle {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: var(--toast-bg);
  color: var(--toast-fg);
  border: 0;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
  font-size: 12.5px; font-weight: 700;
  transition: transform 0.14s ease;
}
.painel-toggle:hover { transform: translateY(-1px); }
.painel-toggle:active { transform: translateY(0); }
.painel-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.painel-resumo {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.painel-chevron {
  font-size: 11px; opacity: 0.7;
  transition: transform 0.16s ease;
}
.painel-chevron.aberto { transform: rotate(180deg); }

.painel-corpo {
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: var(--space-4);
  width: 280px;
  max-height: 70vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
}

.painel-grupo { display: flex; flex-direction: column; gap: var(--space-2); }
.painel-grupo-label {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--muted);
}
.painel-opcoes { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.painel-opcoes button {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  padding: 6px 11px;
  font-size: 12px; font-weight: 700;
  border-radius: var(--radius-sm);
  transition: background 0.12s ease, color 0.12s ease;
}
.painel-opcoes button:hover { color: var(--fg); }
.painel-opcoes button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.painel-opcoes button.active {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--surface);
}

.painel-contagem {
  font-size: 12px; font-weight: 700;
  color: var(--fg);
  padding: var(--space-2);
  background: var(--ok-soft);
  border-radius: var(--radius-sm);
}
.painel-contagem.acima { background: var(--warn-soft); }

.painel-reset {
  padding: var(--space-2);
  background: transparent;
  color: var(--muted);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.painel-reset:hover { color: var(--danger); border-color: var(--danger); }
.painel-reset:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 560px) {
  .painel { left: var(--space-4); right: var(--space-4); align-items: stretch; }
  .painel-corpo { width: auto; }
  .painel-toggle { justify-content: center; }
}

::-webkit-scrollbar { width: 0; height: 0; }
</style>
