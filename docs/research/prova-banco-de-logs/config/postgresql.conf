# Gravação segura (padrões oficiais, escritos para ficar registrado).
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = lz4
# Memória: 25% da RAM de 2 GB em shared_buffers, guia oficial.
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
max_connections = 20
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
gin_pending_list_limit = 4MB
autovacuum_max_workers = 1
listen_addresses = '*'
